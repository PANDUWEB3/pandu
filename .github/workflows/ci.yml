name: PANDU application CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  node:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Backend install, type check, tests, build, and audit
        working-directory: backend
        run: |
          npm ci
          npm run build
          npm test
          npm audit --audit-level=low
      - name: Frontend install, type check, tests, build, and audit
        working-directory: frontend
        run: |
          npm ci
          npx tsc -b
          npm test
          npm run build
          npm audit --audit-level=low

  secrets:
    name: Gitleaks history scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - name: Install pinned Gitleaks
        run: go install github.com/gitleaks/gitleaks/v8@v8.30.1
      - name: Scan full application repository history
        run: gitleaks git --redact --config .gitleaks.toml --log-opts=--all
